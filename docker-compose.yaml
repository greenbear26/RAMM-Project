name: project-app-team-repo

services:
  app:
    build: ./app
    container_name: web-app
    hostname: web-app
    volumes:
      - ./app/src:/appcode
      - ./datasets:/appcode/datasets
    environment:
      - WATCHPACK_POLLING=true
    ports:
      - 8501:8501
  
  api:
    build: ./api
    container_name: web-api
    hostname: web-api
    volumes: ["./api:/apicode"]
    environment:
      - WATCHPACK_POLLING=true
    ports:
      - 4000:4000
    depends_on:
      db:
        condition: service_healthy

  db:
    env_file:
      - ./api/.env
    image: mysql:9
    container_name: mysql_db
    hostname: db
    # Ephemeral database: tmpfs (RAM) at /var/lib/mysql explicitly overrides
    # the mysql:9 image's VOLUME directive. Every recreate of the db
    # container reseeds from database-files/*.sql. Matches production
    # behavior. To pick up SQL edits: `docker compose down && docker compose up`.
    volumes:
      - "./database-files:/docker-entrypoint-initdb.d/:ro"
    tmpfs:
      - /var/lib/mysql
    ports:
      - 3200:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
